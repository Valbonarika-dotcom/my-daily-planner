
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Daily Planner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3f7;color:#333;font-family:Arial,sans-serif}
header{background:#d9b5cc;padding:28px 16px;text-align:center}
h1{margin:0;font-size:28px}
header p{margin-bottom:0}
main{max-width:600px;margin:auto;padding:16px}
section{background:white;padding:20px;border-radius:18px;margin:16px 0;box-shadow:0 3px 12px #0001}
h2{font-size:20px;margin-top:0}
input,select,button{font-size:16px;padding:12px;border-radius:10px}
input{border:1px solid #ddd;max-width:100%}
input[type=text]{width:100%;margin:6px 0}
input[type=date]{width:100%;margin:8px 0}
button{border:0;background:#ad799e;color:white;cursor:pointer}
.add{width:100%;margin-top:6px}
li{padding:10px 0;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center;overflow-wrap:anywhere}
li span{flex:1}
li.done span{text-decoration:line-through;color:#999}
li button{padding:6px 10px;background:#e9d9e5;color:#563c50}
ul{padding:0;list-style:none}
footer{text-align:center;padding:20px;color:#777}
</style>
</head>
<body>
<header>
<h1>🌸 My Daily Planner</h1>
<p id="subtitle">Organizza la tua giornata</p>
<br>
<select id="lang" onchange="render()">
<option value="it">Italiano 🇮🇹</option>
<option value="en">English 🇬🇧</option>
</select>
</header>
<main>
<section>
<h2 id="dateTitle">📅 La mia agenda</h2>
<input type="date" id="date">
<input id="event" type="text" placeholder="Scrivi un impegno">
<button class="add" id="eventBtn" onclick="add('events','event')">Aggiungi</button>
<ul id="events"></ul>
</section>
<section>
<h2 id="taskTitle">✅ Le mie attività</h2>
<input id="task" type="text" placeholder="Scrivi un'attività">
<button class="add" id="taskBtn" onclick="add('tasks','task')">Aggiungi</button>
<ul id="tasks"></ul>
</section>
<section>
<h2 id="shopTitle">🛒 Lista della spesa</h2>
<input id="shop" type="text" placeholder="Cosa devi comprare?">
<button class="add" id="shopBtn" onclick="add('shopping','shop')">Aggiungi</button>
<ul id="shopping"></ul>
</section>
</main>
<footer>Made with ❤️ | My Daily Planner</footer>
<script>
const key="myDailyPlannerData";
let data;
try {
 data=JSON.parse(localStorage.getItem(key))||{};
} catch(e){data={}}
for(const k of ["events","tasks","shopping"]){
 if(!Array.isArray(data[k]))data[k]=[];
}
const $=id=>document.getElementById(id);
const today=()=>{
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
$("date").value=today();
function save(){localStorage.setItem(key,JSON.stringify(data))}
function add(type,id){
 const value=$(id).value.trim();
 if(!value)return;
 const item={text:value,done:false};
 if(type==="events")item.date=$("date").value;
 data[type].push(item);
 $(id).value="";
 save();render();
}
function toggle(type,i){
 data[type][i].done=!data[type][i].done;
 save();render();
}
function removeItem(type,i){
 data[type].splice(i,1);
 save();render();
}
function renderList(type){
 const ul=$(type);
 ul.replaceChildren();
 data[type].forEach((item,i)=>{
  if(type==="events"&&item.date!==$("date").value)return;
  const li=document.createElement("li");
  if(item.done)li.className="done";
  const check=document.createElement("input");
  check.type="checkbox";
  check.checked=item.done;
  check.onchange=()=>toggle(type,i);
  const span=document.createElement("span");
  span.textContent=item.text;
  const del=document.createElement("button");
  del.textContent="✕";
  del.onclick=()=>removeItem(type,i);
  li.append(check,span,del);
  ul.append(li);
 });
}
const labels={
 it:["Organizza la tua giornata","📅 La mia agenda","✅ Le mie attività","🛒 Lista della spesa","Aggiungi","Scrivi un impegno","Scrivi un'attività","Cosa devi comprare?"],
 en:["Organize your day","📅 My calendar","✅ My tasks","🛒 Shopping list","Add","Write an event","Write a task","What do you need to buy?"]
};
function render(){
 const l=labels[$("lang").value];
 ["subtitle","dateTitle","taskTitle","shopTitle"].forEach((id,i)=>$(id).textContent=l[i]);
 ["eventBtn","taskBtn","shopBtn"].forEach(id=>$(id).textContent=l[4]);
 ["event","task","shop"].forEach((id,i)=>$(id).placeholder=l[i+5]);
 ["events","tasks","shopping"].forEach(renderList);
}
$("date").onchange=render;
render();
</script>
</body>
</html>
